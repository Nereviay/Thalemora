<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc">
  <title id="title">Thalemora · 洄海</title>
  <desc id="desc">深蓝色水面与层叠波纹，象征有出处的记忆和延续的经历。</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1527"/><stop offset=".55" stop-color="#102945"/><stop offset="1" stop-color="#153c63"/>
    </linearGradient>
    <radialGradient id="light" cx=".86" cy=".6" r=".65">
      <stop stop-color="#56a8e8" stop-opacity=".19"/><stop offset="1" stop-color="#56a8e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ripple" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#71a4ce" stop-opacity="0"/><stop offset=".58" stop-color="#9dd6ff" stop-opacity=".48"/><stop offset="1" stop-color="#8bc7f3" stop-opacity=".12"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="300" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
