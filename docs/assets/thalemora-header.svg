      <path d="M342 322 C580 364 744 165 962 201 S1176 343 1412 254"/>
      <path d="M327 339 C572 380 758 184 974 220 S1192 364 1425 273"/>
    </g>
    <circle cx="1028" cy="93" r="40" fill="none" stroke="#b4dcff" stroke-opacity=".2"/>
    <circle cx="1028" cy="93" r="29" fill="none" stroke="#b4dcff" stroke-opacity=".12"/>
    <circle cx="1028" cy="93" r="4" fill="#c7e7ff" fill-opacity=".7"/>
    <text x="70" y="150" fill="#f1f7ff" font-family="Georgia, 'Times New Roman', serif" font-size="76" letter-spacing="1">Thalemora</text>
    <text x="74" y="207" fill="#8eaac5" font-family="sans-serif" font-size="14" letter-spacing="3.5">MEMORY &amp; CONTINUITY</text>
